services:
  paperclip:
    image: ghcr.io/birdcar/paperclip-docker:latest
    environment:
      # Coolify auto-generated
      - SERVICE_FQDN_PAPERCLIP_3100
      - BETTER_AUTH_SECRET=${SERVICE_PASSWORD_64_AUTHSECRET}
      - PAPERCLIP_PUBLIC_URL=${SERVICE_FQDN_PAPERCLIP_3100}

      # Deployment mode
      - PAPERCLIP_DEPLOYMENT_MODE=authenticated
      - PAPERCLIP_DEPLOYMENT_EXPOSURE=private

      # Claude Code auth (Max subscription — do NOT set ANTHROPIC_API_KEY)
      - CLAUDE_CODE_OAUTH_TOKEN=${CLAUDE_CODE_OAUTH_TOKEN}

      # S3-compatible storage (MinIO)
      - PAPERCLIP_STORAGE_PROVIDER=s3
      - PAPERCLIP_STORAGE_S3_BUCKET=paperclip
      - PAPERCLIP_STORAGE_S3_REGION=us-east-1
      - PAPERCLIP_STORAGE_S3_ENDPOINT=http://minio:9000
      - PAPERCLIP_STORAGE_S3_FORCE_PATH_STYLE=true
      - AWS_ACCESS_KEY_ID=${SERVICE_PASSWORD_MINIO_ROOT_USER}
      - AWS_SECRET_ACCESS_KEY=${SERVICE_PASSWORD_64_MINIO_ROOT_PASSWORD}

      # Server defaults (inherited from image, explicit for clarity)
      - HOST=0.0.0.0
      - PORT=3100
    volumes:
      - paperclip-data:/paperclip
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:3100/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - default
      - openclaw-bridge
    depends_on:
      minio:
        condition: service_healthy
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      - MINIO_ROOT_USER=${SERVICE_PASSWORD_MINIO_ROOT_USER}
      - MINIO_ROOT_PASSWORD=${SERVICE_PASSWORD_64_MINIO_ROOT_PASSWORD}
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      sh -c "
        mc alias set local http://minio:9000 $${MINIO_ROOT_USER} $${MINIO_ROOT_PASSWORD} &&
        mc mb --ignore-existing local/paperclip
      "
    environment:
      - MINIO_ROOT_USER=${SERVICE_PASSWORD_MINIO_ROOT_USER}
      - MINIO_ROOT_PASSWORD=${SERVICE_PASSWORD_64_MINIO_ROOT_PASSWORD}

networks:
  openclaw-bridge:
    external: true
    name: paperclip-openclaw

volumes:
  paperclip-data:
  minio-data:
